
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>LIVE Comment Reader</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101827;color:white;
 font-family:Arial,sans-serif;padding:20px;
}
.container{max-width:500px;margin:auto}
h1{font-size:25px}
.card{
 background:#1e293b;border-radius:16px;
 padding:18px;margin:16px 0;
}
.status{color:#fbbf24;font-weight:bold}
.status.online{color:#4ade80}
button,select{
 width:100%;padding:15px;border:0;
 border-radius:10px;font-size:16px;
 margin:6px 0;
}
.start{background:#16a34a;color:white}
.stop{background:#dc2626;color:white}
.pause{background:#334155;color:white}
select{background:#334155;color:white}
.comment{
 padding:12px 0;border-bottom:1px solid #475569;
 overflow-wrap:anywhere;
}
.small{color:#94a3b8;font-size:13px}
</style>
</head>
<body>
<div class="container">
<h1>🎙 LIVE Comment Reader</h1>
<p class="small">@mini.ev.makassar</p>

<div class="card">
 <p>Status koneksi</p>
 <div id="status" class="status">● Menghubungkan...</div>
 <p id="liveStatus" class="small">Menunggu status LIVE</p>
</div>

<div class="card">
 <p>Pengaturan suara</p>
 <select id="voice"></select>
 <label>Kecepatan membaca</label>
 <select id="speed">
  <option value="1">Normal</option>
  <option value="0.85">Lambat</option>
  <option value="1.15">Cepat</option>
 </select>
 <button class="start" id="start">▶ MULAI MEMBACA</button>
 <button class="pause" id="pause">Ⅱ JEDA</button>
 <button class="stop" id="stop">■ BERHENTI</button>
</div>

<div class="card">
 <p>Komentar masuk</p>
 <div id="comments">
  <p class="small">Belum ada komentar.</p>
 </div>
</div>
</div>

<script>
let socket;
let reading=false;
let paused=false;
let queue=[];
let voices=[];

const statusEl=document.getElementById("status");
const liveEl=document.getElementById("liveStatus");
const commentsEl=document.getElementById("comments");
const voiceEl=document.getElementById("voice");

function loadVoices(){
 voices=speechSynthesis.getVoices();
 voiceEl.innerHTML="";
 const choices=voices.filter(v=>
   v.lang.toLowerCase().startsWith("id")
 );
 (choices.length?choices:voices).forEach((v)=>{
   const o=document.createElement("option");
   o.value=v.name;
   o.textContent=v.name+" ("+v.lang+")";
   voiceEl.appendChild(o);
 });
}
loadVoices();
speechSynthesis.onvoiceschanged=loadVoices;

function connect(){
 const protocol=location.protocol==="https:"?"wss:":"ws:";
 socket=new WebSocket(protocol+"//"+location.host);

 socket.onopen=()=>{
  statusEl.textContent="● Terhubung ke server";
  statusEl.className="status online";
 };

 socket.onmessage=(event)=>{
  const data=JSON.parse(event.data);

  if(data.type==="status"){
   liveEl.textContent=data.live?
    "TikTok sedang LIVE":"TikTok tidak sedang LIVE";
  }

  if(data.type==="comment"){
   addComment(data);
  }
 };

 socket.onclose=()=>{
  statusEl.textContent="● Terputus";
  statusEl.className="status";
  setTimeout(connect,3000);
 };
}

function addComment(data){
 const item=document.createElement("div");
 item.className="comment";

 const name=document.createElement("b");
 name.textContent="@"+data.username;

 const message=document.createElement("div");
 message.textContent=data.text;

 item.append(name,message);
 commentsEl.prepend(item);

 if(commentsEl.children.length>30){
  commentsEl.lastElementChild.remove();
 }

 if(reading){
  queue.push(data);
  speakNext();
 }
}

function speakNext(){
 if(!reading||paused||speechSynthesis.speaking||
    speechSynthesis.pending||queue.length===0)return;

 const data=queue.shift();
 const utterance=new SpeechSynthesisUtterance(
  data.username+" mengatakan, "+data.text
 );

 utterance.lang="id-ID";
 utterance.rate=Number(document.getElementById("speed").value);
 utterance.pitch=1.12;

 const selected=voices.find(v=>v.name===voiceEl.value);
 if(selected)utterance.voice=selected;

 utterance.onend=()=>speakNext();
 utterance.onerror=()=>speakNext();

 speechSynthesis.speak(utterance);
}

document.getElementById("start").onclick=()=>{
 reading=true;
 paused=false;
 speechSynthesis.resume();
 speakNext();
};

document.getElementById("pause").onclick=()=>{
 paused=!paused;
 if(paused)speechSynthesis.pause();
 else{
  speechSynthesis.resume();
  speakNext();
 }
};

document.getElementById("stop").onclick=()=>{
 reading=false;
 paused=false;
 queue=[];
 speechSynthesis.cancel();
};

connect();
</script>
</body>
</html>
